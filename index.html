let filter = {
  group1:'all',
  group2:'all',
  group3:'all',
  group4:'all'
};

const listWrap = document.getElementById('listWrap');
const backdrop = document.getElementById('backdrop');
const closeModal = document.getElementById('closeModal');
const printBtn = document.getElementById('printBtn');
const mTitle = document.getElementById('mTitle');
const mPeople = document.getElementById('mPeople');
const mMeal = document.getElementById('mMeal');
const mCook = document.getElementById('mCook');
const mIng = document.getElementById('mIng');
const mSteps = document.getElementById('mSteps');
const mNote = document.getElementById('mNote');
const searchInput = document.getElementById('search');

function renderList(){
  const q = searchInput.value.toLowerCase().trim();

  const filtered = data.filter(item=>{
    if(filter.group1 !== 'all' && !item.people.includes(filter.group1)) return false;
    if(filter.group2 !== 'all' && !item.meal.includes(filter.group2)) return false;
    if(filter.group3 !== 'all' && item.cookKey !== filter.group3) return false;
    if(filter.group4 !== 'all' && item.type !== filter.group4) return false;

    if(q){
      const text = `${item.name} ${item.ingredients} ${item.category}`.toLowerCase();
      return text.includes(q);
    }

    return true;
  });

  if(filtered.length === 0){
    listWrap.innerHTML = '<div class="empty-tip">没有找到相关食谱，请换一个关键词或调整筛选。</div>';
    return;
  }

  listWrap.innerHTML = filtered.map(item=>`
    <div class="item" onclick="openModal(${data.indexOf(item)})">
      <div class="item-title">${item.name}</div>
      <div class="item-meta">
        ${item.category} · ${item.temp} · ${item.time}
      </div>
      <div class="tags">
        <span class="tag">${item.people.join(' / ')}</span>
        <span class="tag">${item.meal.join(' / ')}</span>
        <span class="tag">${item.cook.join(' / ')}</span>
      </div>
    </div>
  `).join('');
}

function openModal(index){
  const item = data[index];
  mTitle.textContent = item.name;
  mPeople.textContent = item.people.join(' / ');
  mMeal.textContent = item.meal.join(' / ');
  mCook.textContent = `${item.cook.join(' / ')}｜${item.temp}｜${item.time}`;
  mIng.textContent = item.ingredients;
  mSteps.innerHTML = item.steps.map(s=>`<li>${s}</li>`).join('');
  mNote.textContent = item.note;
  backdrop.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModalFunc(){
  backdrop.style.display = 'none';
  document.body.style.overflow = 'auto';
}

function printRecipe(){
  window.print();
}

closeModal.addEventListener('click', closeModalFunc);
backdrop.addEventListener('click', e=>{
  if(e.target === backdrop) closeModalFunc();
});
printBtn.addEventListener('click', printRecipe);
searchInput.addEventListener('input', renderList);

function bindGroup(id, key){
  const btns = document.querySelectorAll(`#${id} button`);
  btns.forEach(btn=>{
    btn.onclick = ()=>{
      btns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      filter[key] = btn.dataset.val;
      renderList();
    };
  });
}

bindGroup('group1','group1');
bindGroup('group2','group2');
bindGroup('group3','group3');
bindGroup('group4','group4');

renderList();
</script>
