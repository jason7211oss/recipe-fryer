let filter = {
  group1:'all',
  group2:'all',
  group3:'all',
  group4:'all'
}

const tableWrap = document.querySelector('.table-wrap');

function renderTable(){
  let list = data.filter(item=>{
    if(filter.group1 !== 'all' && !item.people.includes(filter.group1)) return false;
    if(filter.group2 !== 'all' && !item.meal.includes(filter.group2)) return false;
    if(filter.group3 !== 'all' && item.cookKey !== filter.group3) return false;
    if(filter.group4 !== 'all' && item.type !== filter.group4) return false;
    return true;
  })
  let html = `<table>
  <thead>
    <tr>
      <th>分类</th>
      <th>菜名</th>
      <th>适用人群</th>
      <th>餐段</th>
      <th>烹饪方式</th>
      <th>温度</th>
      <th>时间</th>
      <th>备注</th>
      <th>食材</th>
      <th>步骤</th>
    </tr>
  </thead>
  <tbody>`;
  list.forEach(item=>{
    html += `<tr>
      <td>${item.category}</td>
      <td>${item.name}</td>
      <td>${item.people.join(',')}</td>
      <td>${item.meal.join(',')}</td>
      <td>${item.cook.join(',')}</td>
      <td>${item.temp}</td>
      <td>${item.time}</td>
      <td>${item.note}</td>
      <td>${item.ingredients}</td>
      <td>${item.steps.join('；')}</td>
    </tr>`
  })
  html += `</tbody></table>`;
  tableWrap.innerHTML = html;
}

function bindGroup(id,key){
  const btns = document.querySelectorAll(`#${id} button`);
  btns.forEach(btn=>{
    btn.onclick = ()=>{
      btns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      filter[key] = btn.dataset.val;
      renderTable();
    }
  })
}
bindGroup('group1','group1');
bindGroup('group2','group2');
bindGroup('group3','group3');
bindGroup('group4','group4');

renderTable();
